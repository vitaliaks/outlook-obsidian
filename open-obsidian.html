<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Open in Obsidian</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell taskpane">
    <img class="logo" src="icons/icon-80.png" alt="" width="80" height="80">
    <h1>Open in Obsidian</h1>
    <p>The note remains in this browser URL fragment and is not sent to the hosting server.</p>
    <a id="open-obsidian" class="button-link" href="#" hidden>Open Obsidian</a>
    <p id="bridge-status" class="status error" role="status" aria-live="polite">Preparing note…</p>
  </main>
  <script src="open-obsidian.js"></script>
</body>
</html>
