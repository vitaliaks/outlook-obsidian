<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://officeapis.public.onecdn.static.microsoft https://appsforoffice.microsoft.com 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Outlook to Obsidian</title>
  <link rel="stylesheet" href="styles.css?v=1.1.0">
  <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
  <script src="taskpane.js?v=1.1.0" defer></script>
</head>
<body>
  <main class="shell taskpane">
    <img class="logo" src="icons/icon-80.png" alt="" width="80" height="80">
    <h1>Outlook to Obsidian</h1>
    <p class="app-version">Version <span id="app-version">…</span></p>

    <form id="settings-form" class="settings">
      <label for="vault-name">Vault name</label>
      <input id="vault-name" name="vaultName" type="text" autocomplete="off" required>

      <label for="target-folder">Target folder</label>
      <input id="target-folder" name="targetFolder" type="text" value="Inbox/Email" autocomplete="off" required>

      <div class="button-row">
        <button type="submit">Save settings</button>
        <button id="reset-settings" class="secondary" type="button">Reset</button>
      </div>
      <p class="settings-note">Only these settings are stored locally. Email content is never stored.</p>
    </form>

    <button id="save-button" type="button" disabled>Save to Obsidian</button>
    <button id="copy-and-continue" class="secondary action-fallback" type="button" hidden>Copy note and continue</button>
    <a id="continue-link" class="continue-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Continue in browser</a>
    <p id="status" class="status" role="status" aria-live="polite">Loading…</p>

    <details class="debug-panel" open>
      <summary>Diagnostics</summary>
      <pre id="debug-output" aria-live="polite"></pre>
      <button id="copy-debug" class="secondary" type="button">Copy diagnostics</button>
      <p class="settings-note">Diagnostics contain no email content, subject, addresses, or generated URI.</p>
    </details>
  </main>
</body>
</html>
